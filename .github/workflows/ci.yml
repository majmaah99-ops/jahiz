name: JAHIZ CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: ./backend

jobs:
  test:
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Install CmdStan backend for Prophet
        run: python -c "import cmdstanpy; cmdstanpy.install_cmdstan()"

      - name: Verify Prophet loads
        run: |
          python -c "
          from prophet import Prophet
          import pandas as pd
          m = Prophet()
          m.fit(pd.DataFrame({'ds': pd.date_range('2024-01-01', periods=30), 'y': range(30)}))
          print('Prophet backend OK')
          "

      - name: Generate synthetic data
        run: python -m app.data_generator

      - name: Run pipeline smoke test
        run: python -m app.pipeline

      - name: Run unit tests
        run: pytest tests/ -v --cov=app --cov-report=term-missing

  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff black
      - run: ruff check app/ tests/ || true
      - run: black --check app/ tests/ || true
