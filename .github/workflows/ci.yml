name: JAHIZ CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: ./backend

jobs:
  test:
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Generate synthetic data
        run: python -m app.data_generator

      - name: Verify data files
        run: |
          ls -la data/
          test -f data/invoices.csv && echo "invoices.csv OK"
          test -f data/bank.csv && echo "bank.csv OK"

      - name: Test feature engineering
        run: |
          python -c "
          import pandas as pd
          from app.config import DATA_DIR
          from app.feature_engineer import extract_all
          inv = pd.read_csv(DATA_DIR / 'invoices.csv', parse_dates=['issue_date'])
          bank = pd.read_csv(DATA_DIR / 'bank.csv', parse_dates=['date'])
          f = extract_all(inv, bank)
          print('Features:', len(f))
          assert len(f) == 8
          print('Feature engineering OK')
          "

      - name: Test scoring engine
        run: |
          python -c "
          from app.score_engine import train_model, predict_score
          model, explainer = train_model()
          sample = {
              'customer_hhi': 0.42, 'dso_days': 35.0, 'cashflow_volatility': 0.60,
              'invoice_value_trend': 0.12, 'seasonality_strength': 1.25,
              'fixed_cost_ratio': 0.55, 'supplier_delay_days': 28.0,
              'monthly_revenue_avg': 95_000.0,
          }
          result = predict_score(sample, model, explainer)
          assert 0 <= result['jahiz_ready_score'] <= 1000
          print('Score:', result['jahiz_ready_score'], '/ 1000')
          print('Scoring engine OK')
          "

      - name: Run unit tests (skip Prophet)
        run: pytest tests/ -v -k "not forecast and not report" --cov=app --cov-report=term-missing

  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff black
      - run: ruff check app/ tests/ || true
      - run: black --check app/ tests/ || true
