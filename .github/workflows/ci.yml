name: JAHIZ CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: ./backend

jobs:
  test:
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Verify imports
        run: |
          python -c "import pandas; print('pandas', pandas.__version__)"
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import prophet; print('prophet OK')"
          python -c "import xgboost; print('xgboost', xgboost.__version__)"
          python -c "import shap; print('shap', shap.__version__)"

      - name: Generate synthetic data
        run: python -m app.data_generator

      - name: Verify data files
        run: |
          ls -la data/
          test -f data/invoices.csv && echo "invoices.csv OK"
          test -f data/bank.csv && echo "bank.csv OK"

      - name: Run pipeline smoke test
        run: python -m app.pipeline

      - name: Run unit tests
        run: pytest tests/ -v --cov=app --cov-report=term-missing

  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: pip install ruff black
      - name: Run ruff
        run: ruff check app/ tests/ || true
      - name: Run black check
        run: black --check app/ tests/ || true
